name: Build and Push Docker Image on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      imageTag:
        description: "Docker image tag"
        required: false
        default: "custom-0.0.3"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker tags
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: danzz0024511/postgres-mcp
          tags: |
            type=raw,value=${{ github.event.inputs.imageTag || github.event.release.tag_name }}
            type=raw,value=latest

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=registry,ref=danzz0024511/postgres-mcp:buildcache
          cache-to: type=registry,ref=danzz0024511/postgres-mcp:buildcache,mode=max
